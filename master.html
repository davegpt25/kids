<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>키즈루트 — 관리 포털</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* ── CSS 변수 (기존 index.html과 동일) ── */
:root {
  --primary:       #F97316;
  --primary-dark:  #EA6C0A;
  --primary-light: #FFF7ED;
  --bg-base:       #F8FAFC;
  --bg-card:       #FFFFFF;
  --border:        #E2E8F0;
  --text-main:     #1E293B;
  --text-sub:      #64748B;
  --text-muted:    #94A3B8;
  --green:         #10B981;
  --red:           #EF4444;
  --yellow:        #F59E0B;
  --indigo:        #6366F1;
  --indigo-light:  #EEF2FF;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-base);
  color: var(--text-main);
  font-size: 13px;
}

/* ── 뷰 전환 ── */
.view { display: none; }
.view.active { display: flex; }

/* ═══════════════════════════════
   LOGIN VIEW
═══════════════════════════════ */
#view-login {
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #FFF7ED 0%, #F8FAFC 100%);
}
.login-card {
  background: white;
  border-radius: 24px;
  border: 1px solid var(--border);
  box-shadow: 0 8px 40px rgba(0,0,0,0.08);
  padding: 48px 40px;
  width: 380px;
  text-align: center;
}
.login-logo-wrap {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin-bottom: 32px;
}
.login-logo-icon {
  width: 44px; height: 44px; border-radius: 14px;
  background: linear-gradient(135deg, #FF9A3C, #F97316);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.login-logo-text {
  font-size: 22px; font-weight: 900; color: var(--text-main); letter-spacing: -0.5px;
}
.login-logo-text span { color: var(--primary); }
.login-subtitle {
  font-size: 14px; color: var(--text-sub); margin-bottom: 36px; line-height: 1.6;
}
.login-google-btn {
  width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  background: white; border: 1.5px solid var(--border);
  border-radius: 12px; padding: 14px 20px;
  font-size: 14px; font-weight: 700; color: var(--text-main);
  cursor: pointer; transition: all .15s; font-family: inherit;
}
.login-google-btn:hover { border-color: var(--primary); box-shadow: 0 2px 12px rgba(249,115,22,0.15); }
.login-google-icon { font-size: 20px; }
.login-loading {
  margin-top: 20px; font-size: 12px; color: var(--text-muted);
  display: none;
}
.login-error {
  margin-top: 16px; font-size: 12px; color: var(--red);
  background: #FEF2F2; border-radius: 8px; padding: 10px 14px;
  display: none;
}
</style>
</head>
<body>

<!-- ══ VIEW: LOGIN ══ -->
<div id="view-login" class="view active">
  <div class="login-card">
    <div class="login-logo-wrap">
      <div class="login-logo-icon">🗺️</div>
      <div class="login-logo-text">키즈<span>루트</span></div>
    </div>
    <p class="login-subtitle">관리자 및 학원 원장 포털에<br>오신 것을 환영합니다</p>
    <button class="login-google-btn" id="googleLoginBtn" onclick="signInWithGoogle()">
      <span class="login-google-icon">G</span>
      Google 계정으로 로그인
    </button>
    <p class="login-loading" id="loginLoading">⏳ 로그인 처리 중...</p>
    <p class="login-error" id="loginError"></p>
  </div>
</div>

<!-- ══ VIEW: MASTER (Task 3에서 추가) ══ -->
<div id="view-master" class="view">
</div>

<!-- ══ VIEW: ACADEMY PORTAL (Task 5에서 추가) ══ -->
<div id="view-academy" class="view">
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

// ── Firebase 초기화 ──────────────────────────────────────
// ⚠️  TODO: Firebase Console에서 웹 앱 설정을 가져와 아래에 붙여넣으세요
// https://console.firebase.google.com → 프로젝트 설정 → 내 앱 → 웹앱 → firebaseConfig
const firebaseConfig = {
  apiKey:            "YOUR_API_KEY",
  authDomain:        "YOUR_PROJECT.firebaseapp.com",
  projectId:         "YOUR_PROJECT_ID",
  storageBucket:     "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId:             "YOUR_APP_ID"
};

// Config 미설정 감지
const isConfigured = firebaseConfig.apiKey !== "YOUR_API_KEY";

let auth = null;
if (isConfigured) {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  // ── 인증 상태 감지 ──────────────────────────────────────
  onAuthStateChanged(auth, routeUser);

  // ── Google 로그인 ────────────────────────────────────────
  window.signInWithGoogle = async function() {
    document.getElementById('loginLoading').style.display = 'block';
    document.getElementById('loginError').style.display = 'none';
    document.getElementById('googleLoginBtn').disabled = true;
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      document.getElementById('loginLoading').style.display = 'none';
      document.getElementById('googleLoginBtn').disabled = false;
      document.getElementById('loginError').textContent = '로그인 실패: ' + e.message;
      document.getElementById('loginError').style.display = 'block';
    }
  };

  // ── 로그아웃 ──────────────────────────────────────────────
  window.handleSignOut = async function() {
    await signOut(auth);
    showView('view-login');
    document.getElementById('loginError').style.display = 'none';
  };

} else {
  // Config 미설정 시 안내 메시지
  window.signInWithGoogle = function() {
    document.getElementById('loginError').textContent =
      '⚠️ Firebase 설정이 필요합니다. master.html의 firebaseConfig를 채워주세요. (Firebase Console → 프로젝트 설정 → 웹앱)';
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('loginLoading').style.display = 'none';
  };
  window.handleSignOut = function() { showView('view-login'); };
}

// ── 상수 ──────────────────────────────────────────────────
const MASTER_EMAIL = 'davegpt25@gmail.com';

// ── 뷰 전환 헬퍼 ──────────────────────────────────────────
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
window.showView = showView;

// ── localStorage 헬퍼 ─────────────────────────────────────
window.getInvites = function() {
  try { return JSON.parse(localStorage.getItem('kidsroute_invites') || '[]'); }
  catch { return []; }
};
window.saveInvites = function(list) {
  localStorage.setItem('kidsroute_invites', JSON.stringify(list));
};
window.getAcademyData = function(id) {
  try { return JSON.parse(localStorage.getItem('kidsroute_academy_' + id) || 'null'); }
  catch { return null; }
};
window.saveAcademyData = function(id, data) {
  localStorage.setItem('kidsroute_academy_' + id, JSON.stringify(data));
};

// ── 라우팅 ────────────────────────────────────────────────
function routeUser(user) {
  if (!user) { showView('view-login'); return; }

  const email = user.email;
  document.getElementById('loginLoading').style.display = 'none';

  if (email === MASTER_EMAIL) {
    renderMasterDashboard(user);
    showView('view-master');
    return;
  }

  const invite = window.getInvites().find(i => i.email === email);
  if (invite) {
    renderAcademyPortal(user, invite);
    showView('view-academy');
    return;
  }

  // 접근 거부
  showView('view-login');
  const errEl = document.getElementById('loginError');
  errEl.textContent = email + ' 계정은 접근 권한이 없습니다. 관리자에게 초대를 요청하세요.';
  errEl.style.display = 'block';
  if (auth) signOut(auth);
}

// ── stubs (Task 3, 5에서 교체됨) ──────────────────────────
window.renderMasterDashboard = function(user) {
  document.getElementById('view-master').innerHTML =
    '<div style="padding:40px;font-size:18px;font-weight:700;color:#1E293B;">✅ Master 대시보드: ' + user.email + '<br><br><button onclick="handleSignOut()" style="font-size:14px;padding:8px 16px;border:1px solid #E2E8F0;border-radius:8px;cursor:pointer;background:white;">로그아웃</button></div>';
};
window.renderAcademyPortal = function(user, invite) {
  document.getElementById('view-academy').innerHTML =
    '<div style="padding:40px;font-size:18px;font-weight:700;color:#6366F1;">🏫 원장 포털: ' + invite.academyName + '<br><br><button onclick="handleSignOut()" style="font-size:14px;padding:8px 16px;border:1px solid #E2E8F0;border-radius:8px;cursor:pointer;background:white;">로그아웃</button></div>';
};
</script>
</body>
</html>
